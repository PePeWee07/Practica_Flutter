# Configuración del analizador estático de Dart/Flutter.
# Estándar 1.1: reglas de lint definidas por el equipo.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Modo estricto: refuerza el tipado fuerte y ayuda con el estándar 1.4 (evitar dynamic).
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Elevar a ERROR lo más importante para que rompa el build/PR si se incumple.
    always_declare_return_types: error   # 1.3
    avoid_print: error                   # 1.1
    # El resto quedan como warning (no bloquean, pero se ven en el análisis).

linter:
  rules:
    # --- 1.1 / ejemplo del PDF ---
    avoid_print: true
    always_declare_return_types: true          # 1.3
    prefer_final_locals: true                  # 1.5
    prefer_const_constructors: true            # 1.6

    # --- 1.5 Preferir final sobre var ---
    prefer_final_fields: true
    prefer_final_in_for_each: true

    # --- 1.6 Usar const siempre que se pueda ---
    prefer_const_declarations: true
    prefer_const_constructors_in_immutables: true
    prefer_const_literals_to_create_immutables: true
    unnecessary_const: true
    unnecessary_new: true

    # --- 1.4 Evitar dynamic ---
    avoid_dynamic_calls: true

    # --- 2.x Convenciones de nombres ---
    camel_case_types: true                     # 2.2 Clases en PascalCase
    camel_case_extensions: true
    non_constant_identifier_names: true        # 2.3 variables/métodos camelCase
    constant_identifier_names: true
    file_names: true                           # archivos en snake_case

    # --- Calidad / código muerto / consistencia ---
    prefer_single_quotes: true
    require_trailing_commas: true              # ayuda a dart format y a diffs limpios
    unnecessary_this: true
    unnecessary_late: true
    avoid_unused_constructor_parameters: true
    prefer_relative_imports: true
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true
    sort_child_properties_last: true
    unawaited_futures: true

